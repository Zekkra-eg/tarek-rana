<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>Tarek & Rana Wedding</title>


  <!-- =========================
       SOCIAL MEDIA PREVIEW
  ========================== -->

  <meta
    name="description"
    content="Tarek & Rana Wedding Invitation"
  >

  <meta
    property="og:title"
    content="Tarek & Rana Wedding"
  >

  <meta
    property="og:description"
    content="Tarek & Rana Wedding Invitation"
  >

  <meta
    property="og:image"
    content="https://tarek-rana.vercel.app/preview.png"
  >

  <meta
    property="og:type"
    content="website"
  >

  <meta
    property="og:url"
    content="https://zekra.link/rana-wedding"
  >

  <meta
    property="og:site_name"
    content="Tarek & Rana Wedding"
  >

  <meta
    name="twitter:card"
    content="summary_large_image"
  >

  <meta
    name="twitter:title"
    content="Tarek & Rana Wedding"
  >

  <meta
    name="twitter:description"
    content="Tarek & Rana Wedding Invitation"
  >

  <meta
    name="twitter:image"
    content="https://tarek-rana.vercel.app/preview.png"
  >


  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }


    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      padding: 0;
      background: #000;
    }


    body {
      overflow-x: hidden;
      overflow-y: auto;
    }


    /* =========================
       INVITATION WRAPPER
    ========================== */

    #invitation {
      position: relative;

      width: 100%;

      height: auto;

      background: #000;

      overflow: hidden;
    }


    /* =========================
       CANVA IFRAME
    ========================== */

    #canvaFrame {
      position: absolute;

      top: 0;
      left: 0;

      width: 100%;
      height: 100%;

      border: none;

      display: block;

      z-index: 1;
    }


    /* =========================
       HOTSPOTS
    ========================== */

    .hotspot {
      position: absolute;

      width: 180px;
      height: 160px;

      background: transparent;

      border: none;

      padding: 0;
      margin: 0;

      cursor: pointer;

      z-index: 10;

      display: block;

      -webkit-tap-highlight-color: transparent;

      touch-action: manipulation;
    }


    .hotspot:focus,
    .hotspot:active {
      outline: none;

      background: transparent;
    }


    /* =========================
       MUSIC BUTTON
    ========================== */

    #musicButton {
      position: fixed;

      right: 18px;
      bottom: 18px;

      z-index: 999999;

      min-width: 82px;
      height: 38px;

      padding: 0 16px;

      border: 1px solid rgba(255, 255, 255, 0.65);

      border-radius: 30px;

      background: rgba(255, 255, 255, 0.08);

      backdrop-filter: blur(8px);

      -webkit-backdrop-filter: blur(8px);

      color: white;

      font-family: Arial, sans-serif;

      font-size: 12px;

      letter-spacing: 1.5px;

      font-weight: 500;

      cursor: pointer;

      display: flex;

      align-items: center;

      justify-content: center;

      -webkit-tap-highlight-color: transparent;
    }


    #musicButton:focus {
      outline: none;
    }


    #musicButton:hover {
      background: rgba(255, 255, 255, 0.14);
    }


    /* =========================
       FIRST TOUCH MUSIC LAYER
    ========================== */

    #touchLayer {
      position: fixed;

      inset: 0;

      z-index: 999998;

      background: transparent;

      touch-action: manipulation;
    }

  </style>

</head>


<body>


  <!-- =========================
       HOME
  ========================== -->

  <main id="invitation">


    <iframe
      id="canvaFrame"

      src="https://www.canva.com/design/DAHXDm-Q1U8/4WPheNzhMWogiVXa4VgWkg/view?embed"

      allowfullscreen

      allow="fullscreen; autoplay"

    ></iframe>


    <!-- =========================
         HOME → PG 1
    ========================== -->

    <button
      class="hotspot"
      id="hotspot1"
      aria-label="Open PG 1"
    ></button>


    <!-- =========================
         HOME → PG 2
    ========================== -->

    <button
      class="hotspot"
      id="hotspot2"
      aria-label="Open PG 2"
    ></button>


  </main>


  <!-- =========================
       MUSIC
  ========================== -->

  <audio
    id="song"
    src="/song.mp3"
    preload="auto"
    loop
  ></audio>


  <!-- FIRST TOUCH -->

  <div id="touchLayer"></div>


  <!-- MUSIC BUTTON -->

  <button
    id="musicButton"
    type="button"
  >
    PLAY
  </button>


  <script>

    /* =========================
       ELEMENTS
    ========================== */

    const invitation =
      document.getElementById("invitation");


    const hotspot1 =
      document.getElementById("hotspot1");


    const hotspot2 =
      document.getElementById("hotspot2");


    const song =
      document.getElementById("song");


    const touchLayer =
      document.getElementById("touchLayer");


    const musicButton =
      document.getElementById("musicButton");


    /* =========================
       HOME DESIGN SIZE
    ========================== */

    const DESIGN_WIDTH = 1366;

    const HOME_HEIGHT = 5199;


    /* =========================
       VERCEL PAGES
    ========================== */

    const PG1_URL =
      "https://zekra.link/t-r";


    const PG2_URL =
      "https://zekra.link/t-r/page-2";


    /* =========================
       HOTSPOT SIZE
    ========================== */

    const HOTSPOT_WIDTH = 180;

    const HOTSPOT_HEIGHT = 160;


    /* =========================
       HOME HOTSPOTS
    ========================== */

    const homeHotspots = [

      {
        element: hotspot1,

        x: 979.4,

        y: 1627.4
      },

      {
        element: hotspot2,

        x: 979.4,

        y: 2004.5
      }

    ];


    /* =========================
       SET HOME SIZE
    ========================== */

    function setHomeSize() {

      const displayedWidth =
        invitation.clientWidth;


      const displayedHeight =
        displayedWidth *
        (HOME_HEIGHT / DESIGN_WIDTH);


      invitation.style.height =
        displayedHeight + "px";

    }


    /* =========================
       POSITION HOTSPOTS
    ========================== */

    function positionHotspots() {

      const displayedWidth =
        invitation.clientWidth;


      const scale =
        displayedWidth /
        DESIGN_WIDTH;


      homeHotspots.forEach(
        function(hotspot) {

          const button =
            hotspot.element;


          button.style.left =
            (hotspot.x * scale) +
            "px";


          button.style.top =
            (hotspot.y * scale) +
            "px";


          button.style.width =
            (HOTSPOT_WIDTH * scale) +
            "px";


          button.style.height =
            (HOTSPOT_HEIGHT * scale) +
            "px";

        }
      );

    }


    /* =========================
       INITIAL LAYOUT
    ========================== */

    setHomeSize();

    positionHotspots();


    /* =========================
       RESPONSIVE
    ========================== */

    window.addEventListener(
      "resize",
      function() {

        setHomeSize();

        positionHotspots();

      }
    );


    /* =========================
       HOME → PG 1
    ========================== */

    hotspot1.addEventListener(
      "click",
      function(event) {

        event.preventDefault();

        event.stopPropagation();


        window.location.href =
          PG1_URL;

      }
    );


    /* =========================
       HOME → PG 2
    ========================== */

    hotspot2.addEventListener(
      "click",
      function(event) {

        event.preventDefault();

        event.stopPropagation();


        window.location.href =
          PG2_URL;

      }
    );


    /* =========================
       MUSIC
    ========================== */

    function startMusic() {

      song.volume = 1;

      song.muted = false;


      const promise =
        song.play();


      if (promise !== undefined) {

        promise
          .then(
            function() {

              musicButton.textContent =
                "MUTE";


              touchLayer.style.display =
                "none";

            }
          )
          .catch(
            function(error) {

              console.log(
                "Audio blocked:",
                error
              );

            }
          );

      }

    }


    /* =========================
       FIRST TOUCH
    ========================== */

    touchLayer.addEventListener(
      "touchstart",

      function() {

        startMusic();

      },

      {
        passive: true,
        once: true
      }

    );


    touchLayer.addEventListener(
      "click",

      function() {

        startMusic();

      },

      {
        once: true
      }

    );


    /* =========================
       MUSIC BUTTON
    ========================== */

    musicButton.addEventListener(
      "click",

      function(event) {

        event.stopPropagation();


        if (song.paused) {

          song.volume = 1;

          song.muted = false;


          song.play()

            .then(
              function() {

                musicButton.textContent =
                  "MUTE";

              }
            )

            .catch(
              function(error) {

                console.log(
                  "Audio blocked:",
                  error
                );

              }
            );

        }

        else {

          song.pause();


          musicButton.textContent =
            "PLAY";

        }

      }

    );


    /* =========================
       AUDIO EVENTS
    ========================== */

    song.addEventListener(
      "play",

      function() {

        musicButton.textContent =
          "MUTE";

      }
    );


    song.addEventListener(
      "pause",

      function() {

        musicButton.textContent =
          "PLAY";

      }
    );

  </script>

</body>

</html>
