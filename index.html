<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>Invitation</title>


  <!-- ==================================================
       LINK PREVIEW / OPEN GRAPH
  ================================================== -->

  <meta
    property="og:title"
    content="Your Invitation"
  >

  <meta
    property="og:description"
    content="You're invited to celebrate with us! 🤍"
  >

  <!--
    IMPORTANT:
    Replace this with the DIRECT URL of your preview image.
  -->

  <meta
    property="og:image"
    content="https://your-domain.com/preview.jpg"
  >

  <meta
    property="og:image:width"
    content="1200"
  >

  <meta
    property="og:image:height"
    content="630"
  >

  <meta
    property="og:url"
    content="https://your-domain.com/"
  >

  <meta
    property="og:type"
    content="website"
  >


  <!-- ==================================================
       TWITTER / X PREVIEW
  ================================================== -->

  <meta
    name="twitter:card"
    content="summary_large_image"
  >

  <meta
    name="twitter:title"
    content="Your Invitation"
  >

  <meta
    name="twitter:description"
    content="You're invited to celebrate with us! 🤍"
  >

  <meta
    name="twitter:image"
    content="https://your-domain.com/preview.jpg"
  >


  <!-- ==================================================
       STYLE
  ================================================== -->

  <style>

    /* =========================
       RESET
    ========================= */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }


    html,
    body {

      width: 100%;
      height: 100%;

      overflow: hidden;

      background: #000;

    }


    body {

      font-family: Arial, sans-serif;

      -webkit-tap-highlight-color: transparent;

    }


    /* =========================
       CANVA CONTAINER
    ========================= */

    #canva-container {

      position: fixed;

      inset: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      background: #000;

    }


    /* =========================
       CANVA PAGES
    ========================= */

    .canva-page {

      position: absolute;

      inset: 0;

      width: 100%;
      height: 100%;

      display: none;

    }


    .canva-page.active {

      display: block;

    }


    .canva-page iframe {

      width: 100%;
      height: 100%;

      border: none;

      display: block;

    }


    /* =========================
       NAVIGATION
    ========================= */

    .navigation {

      position: fixed;

      left: 50%;

      bottom: 25px;

      transform: translateX(-50%);

      z-index: 9999;

      display: flex;

      align-items: center;

      gap: 12px;

    }


    .nav-btn {

      border: none;

      background: rgba(0, 0, 0, 0.45);

      color: white;

      padding: 10px 18px;

      border-radius: 30px;

      font-size: 16px;

      cursor: pointer;

      backdrop-filter: blur(8px);

      -webkit-backdrop-filter: blur(8px);

      transition: transform 0.15s ease;

    }


    .nav-btn:active {

      transform: scale(0.92);

    }


    .nav-btn.hidden {

      display: none;

    }


    /* =========================
       MUSIC BUTTON
    ========================= */

    #musicButton {

      position: fixed;

      right: 20px;

      bottom: 20px;

      z-index: 10000;

      width: 48px;

      height: 48px;

      border: none;

      border-radius: 50%;

      background: rgba(0, 0, 0, 0.45);

      color: white;

      display: flex;

      align-items: center;

      justify-content: center;

      cursor: pointer;

      backdrop-filter: blur(8px);

      -webkit-backdrop-filter: blur(8px);

      transition: transform 0.15s ease;

    }


    #musicButton:active {

      transform: scale(0.92);

    }


    #musicIcon {

      font-size: 20px;

      line-height: 1;

    }


    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 600px) {

      .navigation {

        bottom: 20px;

      }


      .nav-btn {

        padding: 9px 15px;

        font-size: 14px;

      }


      #musicButton {

        right: 15px;

        bottom: 75px;

        width: 44px;

        height: 44px;

      }

    }

  </style>

</head>


<body>


  <!-- ==================================================
       BACKGROUND MUSIC
  ================================================== -->

  <audio
    id="bgMusic"
    loop
    preload="auto"
  >

    <!-- CHANGE SONG FILE HERE -->

    <source
      src="song.mp3"
      type="audio/mpeg"
    >

  </audio>



  <!-- ==================================================
       CANVA EMBEDS
  ================================================== -->

  <div id="canva-container">


    <!-- =========================
         CANVA PAGE 1
    ========================= -->

    <div
      id="page1"
      class="canva-page active"
    >

      <!-- CHANGE CANVA LINK HERE -->

      <iframe
        src="https://www.canva.com/design/DAHXDm-Q1U8/4WPheNzhMWogiVXa4VgWkg/view?embed"
        allowfullscreen
      ></iframe>

    </div>




  <!-- ==================================================
       MUSIC BUTTON
  ================================================== -->

  <button
    id="musicButton"
    onclick="toggleMusic()"
    aria-label="Play or mute music"
  >

    <span id="musicIcon">
      🔇
    </span>

  </button>



  <!-- ==================================================
       JAVASCRIPT
  ================================================== -->

  <script>


    /* =========================
       SETTINGS
    ========================= */

    let currentPage = 1;

    const totalPages = 3;

    let musicStarted = false;


    const music =
      document.getElementById("bgMusic");


    const musicIcon =
      document.getElementById("musicIcon");


    const nextButton =
      document.getElementById("nextButton");


    const prevButton =
      document.getElementById("prevButton");



    /* =========================
       SHOW PAGE
    ========================= */

    function showPage(pageNumber) {


      document
        .querySelectorAll(".canva-page")
        .forEach(page => {

          page.classList.remove("active");

        });


      const selectedPage =
        document.getElementById(
          "page" + pageNumber
        );


      if (selectedPage) {

        selectedPage.classList.add("active");

      }



      /* =========================
         PREVIOUS BUTTON
      ========================= */

      if (pageNumber === 1) {

        prevButton.classList.add("hidden");

      } else {

        prevButton.classList.remove("hidden");

      }



      /* =========================
         NEXT BUTTON
      ========================= */

      if (pageNumber === totalPages) {

        nextButton.classList.add("hidden");

      } else {

        nextButton.classList.remove("hidden");

      }

    }



    /* =========================
       NEXT PAGE
    ========================= */

    function nextPage() {


      if (currentPage < totalPages) {

        currentPage++;

        showPage(currentPage);

      }

    }



    /* =========================
       PREVIOUS PAGE
    ========================= */

    function previousPage() {


      if (currentPage > 1) {

        currentPage--;

        showPage(currentPage);

      }

    }



    /* =========================
       START MUSIC
    ========================= */

    function startMusic() {


      if (musicStarted) {

        return;

      }


      music
        .play()
        .then(() => {

          musicStarted = true;

          musicIcon.textContent = "🔊";

        })
        .catch(() => {

          /*
            If Safari blocks the audio,
            the music button can still be used.
          */

        });

    }



    /* =========================
       START MUSIC
       ON FIRST TOUCH
    ========================= */

    document.addEventListener(

      "touchstart",

      function firstTouch() {

        startMusic();

      },

      {
        once: true,
        passive: true
      }

    );



    /* =========================
       DESKTOP SUPPORT
    ========================= */

    document.addEventListener(

      "mousedown",

      function firstMouseClick() {

        startMusic();

      },

      {
        once: true
      }

    );



    /* =========================
       PLAY / MUTE
    ========================= */

    function toggleMusic() {


      if (music.paused) {


        music
          .play()
          .then(() => {

            musicStarted = true;

            musicIcon.textContent = "🔊";

          })
          .catch(() => {});


      } else {


        music.pause();

        musicIcon.textContent = "🔇";

      }

    }



    /* =========================
       INITIAL PAGE
    ========================= */

    showPage(1);


  </script>


</body>

</html>
