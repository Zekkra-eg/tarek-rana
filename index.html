<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <!-- =========================
       PAGE / LINK TITLE
  ========================== -->

  <title>Tarek & Rana Wedding</title>

  <meta
    property="og:title"
    content="Tarek & Rana Wedding"
  >

  <meta
    property="og:description"
    content="You're invited to celebrate our special day 🤍"
  >

  <!-- preview.png is inside public/ -->
  <meta
    property="og:image"
    content="https://zekra.link/preview.png"
  >

  <meta
    property="og:type"
    content="website"
  >

  <meta
    property="og:url"
    content="https://zekra.link/rana-wedding"
  >

  <meta
    name="twitter:card"
    content="summary_large_image"
  >

  <meta
    name="twitter:title"
    content="Tarek & Rana Wedding"
  >

  <meta
    name="twitter:description"
    content="You're invited to celebrate our special day 🤍"
  >

  <meta
    name="twitter:image"
    content="https://zekra.link/preview.png"
  >


  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      background: #fff;
    }

    body {
      overflow-x: hidden;
    }


    /* =========================
       CANVA
    ========================== */

    .canva-wrapper {
      position: relative;

      width: 100%;
      height: 0;

      padding-top: 380.6003%;

      padding-bottom: 0;

      overflow: hidden;

      border-radius: 8px;

      margin: 0;

      will-change: transform;
    }


    #canvaFrame {
      position: absolute;

      width: 100%;
      height: 100%;

      top: 0;
      left: 0;

      border: none;

      padding: 0;
      margin: 0;
    }


    /* =========================
       FIRST TOUCH LAYER
       COMPLETELY INVISIBLE
    ========================== */

    #touchLayer {

      position: fixed;

      inset: 0;

      width: 100%;
      height: 100%;

      background: transparent;

      border: none;

      outline: none;

      z-index: 999999;

      cursor: pointer;

      -webkit-tap-highlight-color: transparent;
    }


    /* =========================
       SOUND BUTTON
       COMPLETELY TRANSPARENT
    ========================== */

    #soundButton {

      position: fixed;

      right: 18px;
      bottom: 18px;

      z-index: 1000000;

      background: transparent;

      border: none;

      outline: none;

      padding: 8px;

      margin: 0;

      color: white;

      font-family: Arial, sans-serif;

      font-size: 12px;

      letter-spacing: 1px;

      text-shadow:
        0 1px 4px rgba(0,0,0,.65);

      cursor: pointer;

      -webkit-tap-highlight-color: transparent;

      display: none;

      appearance: none;
    }


    #soundButton:focus,
    #soundButton:active {

      background: transparent;

      outline: none;

      border: none;
    }


    /* =========================
       NAVIGATION BUTTONS
       TRANSPARENT
    ========================== */

    .nav-button {

      position: absolute;

      z-index: 999998;

      background: transparent;

      border: none;

      outline: none;

      padding: 0;

      margin: 0;

      cursor: pointer;

      display: none;

      -webkit-tap-highlight-color: transparent;
    }


    /* =========================
       PAGE 1 → PAGE 2
       EDIT THESE VALUES
    ========================== */

    #page1Next {

      top: 88%;

      left: 25%;

      width: 50%;

      height: 8%;
    }


    /* =========================
       PAGE 2 → PAGE 3
    ========================== */

    #page2Next {

      top: 88%;

      left: 25%;

      width: 50%;

      height: 8%;
    }


    /* =========================
       PAGE 2 → PAGE 1
    ========================== */

    #page2Back {

      top: 5%;

      left: 5%;

      width: 20%;

      height: 8%;
    }


    .show {
      display: block !important;
    }

  </style>

</head>


<body>


  <!-- =========================
       MUSIC
  ========================== -->

  <audio
    id="song"
    preload="auto"
    loop
    playsinline
  >

    <source
      src="/song.mp3"
      type="audio/mpeg"
    >

  </audio>


  <!-- =========================
       CANVA
  ========================== -->

  <div class="canva-wrapper">

    <iframe
      id="canvaFrame"

      loading="lazy"

      allowfullscreen="allowfullscreen"

      allow="fullscreen"

    ></iframe>


    <!-- PAGE 1 → PAGE 2 -->

    <button
      id="page1Next"
      class="nav-button"
      aria-label="Next"
    ></button>


    <!-- PAGE 2 → PAGE 3 -->

    <button
      id="page2Next"
      class="nav-button"
      aria-label="Next"
    ></button>


    <!-- PAGE 2 → PAGE 1 -->

    <button
      id="page2Back"
      class="nav-button"
      aria-label="Back"
    ></button>

  </div>


  <!-- =========================
       INVISIBLE FIRST TOUCH
    ========================== -->

  <div id="touchLayer"></div>


  <!-- =========================
       MUSIC CONTROL
    ========================== -->

  <button
    id="soundButton"
    aria-label="Music control"
  >
    MUTE
  </button>


  <script>

    /* =========================
       CANVA URLS
    ========================== */

    const PAGE_1 =
      "https://www.canva.com/design/DAHXDm-Q1U8/4WPheNzhMWogiVXa4VgWkg/view?embed";


    const PAGE_2 =
      "https://www.canva.com/design/DAHXJ2qulUI/y1Ny_6cpiQN4chiQ_OMktw/view?embed";


    const PAGE_3 = "";


    /* =========================
       ELEMENTS
    ========================== */

    const song =
      document.getElementById("song");

    const canvaFrame =
      document.getElementById("canvaFrame");

    const touchLayer =
      document.getElementById("touchLayer");

    const soundButton =
      document.getElementById("soundButton");

    const page1Next =
      document.getElementById("page1Next");

    const page2Next =
      document.getElementById("page2Next");

    const page2Back =
      document.getElementById("page2Back");


    let currentPage = 1;


    /* =========================
       START MUSIC
    ========================== */

    function startMusic() {

      song.volume = 1;

      song.muted = false;

      const promise = song.play();

      if (promise !== undefined) {

        promise
          .then(() => {

            console.log(
              "✅ Music started"
            );

            soundButton.textContent =
              "MUTE";

            soundButton.style.display =
              "block";

          })
          .catch(error => {

            console.log(
              "❌ Audio blocked:",
              error
            );

          });

      }

    }


    /* =========================
       SHOW PAGE
    ========================== */

    function showPage(page) {

      currentPage = page;


      page1Next.classList.remove("show");

      page2Next.classList.remove("show");

      page2Back.classList.remove("show");


      if (page === 1) {

        canvaFrame.src = PAGE_1;

        page1Next.classList.add("show");

      }


      else if (page === 2) {

        canvaFrame.src = PAGE_2;

        page2Next.classList.add("show");

        page2Back.classList.add("show");

      }


      else if (page === 3) {

        if (PAGE_3 !== "") {

          canvaFrame.src = PAGE_3;

        }

      }

    }


    /* =========================
       FIRST USER TOUCH
    ========================== */

    function firstInteraction() {

      startMusic();

      showPage(1);

      touchLayer.style.display =
        "none";

    }


    /* =========================
       TOUCH
    ========================== */

    touchLayer.addEventListener(
      "touchstart",
      firstInteraction,
      {
        once: true,
        passive: true
      }
    );


    touchLayer.addEventListener(
      "click",
      firstInteraction,
      {
        once: true
      }
    );


    /* =========================
       PAGE 1 → PAGE 2
    ========================== */

    page1Next.addEventListener(
      "click",
      function(e) {

        e.preventDefault();

        e.stopPropagation();

        showPage(2);

      }
    );


    /* =========================
       PAGE 2 → PAGE 3
    ========================== */

    page2Next.addEventListener(
      "click",
      function(e) {

        e.preventDefault();

        e.stopPropagation();

        if (PAGE_3 !== "") {

          showPage(3);

        }

      }
    );


    /* =========================
       PAGE 2 → PAGE 1
    ========================== */

    page2Back.addEventListener(
      "click",
      function(e) {

        e.preventDefault();

        e.stopPropagation();

        showPage(1);

      }
    );


    /* =========================
       PLAY / MUTE
    ========================== */

    soundButton.addEventListener(
      "click",
      function(e) {

        e.preventDefault();

        e.stopPropagation();


        if (song.muted) {

          song.muted = false;

          song.play();

          soundButton.textContent =
            "MUTE";

        }

        else {

          song.muted = true;

          soundButton.textContent =
            "PLAY";

        }

      }
    );

  </script>

</body>

</html>
