<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="twitter:title"

  >

  <meta
    name="twitter:description"
    content="Tarek & Rana Wedding Invitation"
  >

  <meta
    name="twitter:image"
    content="https://tarek-rana.vercel.app/preview.png"
  >


  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }


    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      padding: 0;
      background: #000;
    }


    body {
      overflow-x: hidden;
      overflow-y: auto;
    }


    /* =========================
       INVITATION WRAPPER
    ========================== */

    #invitation {
      position: relative;
      width: 100%;
      height: auto;
      background: #000;
      overflow: hidden;
    }


    /* =========================
       CANVA IFRAME
    ========================== */

    #canvaFrame {
      position: absolute;
      top: 0;
      left: 0;

      width: 100%;
      height: 100%;

      border: none;
      display: block;

      z-index: 1;
    }


    /* =========================
       HOTSPOTS
    ========================== */

    .hotspot {
      position: absolute;

      width: 180px;
      height: 160px;

      background: transparent;
      border: none;

      padding: 0;
      margin: 0;

      cursor: pointer;

      z-index: 10;

      display: block;

      -webkit-tap-highlight-color: transparent;

      touch-action: manipulation;
    }


    .hotspot:focus,
    .hotspot:active {
      outline: none;
      background: transparent;
    }


    /* =========================
       MUSIC BUTTON
    ========================== */

    #musicButton {
      position: fixed;

      right: 18px;
      bottom: 18px;

      z-index: 999999;

      min-width: 82px;
      height: 38px;

      padding: 0 16px;

      border: 1px solid rgba(255, 255, 255, 0.65);

      border-radius: 30px;

      background: rgba(255, 255, 255, 0.08);

      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);

      color: white;

      font-family: Arial, sans-serif;

      font-size: 12px;

      letter-spacing: 1.5px;

      font-weight: 500;

      cursor: pointer;

      display: flex;

      align-items: center;
      justify-content: center;

      -webkit-tap-highlight-color: transparent;
    }


    #musicButton:focus {
      outline: none;
    }


    #musicButton:hover {
      background: rgba(255, 255, 255, 0.14);
    }


    /* =========================
       FIRST-TOUCH MUSIC LAYER
    ========================== */

    #touchLayer {
      position: fixed;

      inset: 0;

      z-index: 999998;

      background: transparent;

      touch-action: manipulation;
    }

  </style>

</head>


<body>


  <!-- =========================
       INVITATION
  ========================== -->

  <main id="invitation">

    <iframe
      id="canvaFrame"
      src="https://www.canva.com/design/DAHXDm-Q1U8/4WPheNzhMWogiVXa4VgWkg/view?embed"
      allowfullscreen
      allow="fullscreen; autoplay"
    ></iframe>


    <!-- =========================
         HOME → PG 1
    ========================== -->

    <button
      class="hotspot"
      id="hotspot1"
      aria-label="Open PG 1"
    ></button>


    <!-- =========================
         HOME → PG 2
    ========================== -->

    <button
      class="hotspot"
      id="hotspot2"
      aria-label="Open PG 2"
    ></button>

  </main>


  <!-- =========================
       MUSIC
  ========================== -->

  <audio
    id="song"
    src="/song.mp3"
    preload="auto"
    loop
  ></audio>


  <!-- FIRST TOUCH -->

  <div id="touchLayer"></div>


  <!-- MUSIC BUTTON -->

  <button
    id="musicButton"
    type="button"
  >
    PLAY
  </button>


  <script>

    /* =========================
       ELEMENTS
    ========================== */

    const invitation =
      document.getElementById("invitation");

    const canvaFrame =
      document.getElementById("canvaFrame");

    const hotspot1 =
      document.getElementById("hotspot1");

    const hotspot2 =
      document.getElementById("hotspot2");

    const song =
      document.getElementById("song");

    const touchLayer =
      document.getElementById("touchLayer");

    const musicButton =
      document.getElementById("musicButton");


    /* =========================
       DESIGN WIDTH
    ========================== */

    const DESIGN_WIDTH = 1366;


    /* =========================
       PAGE HEIGHTS
    ========================== */

    const HOME_HEIGHT = 5199;

    const PG1_HEIGHT = 6976;

    const PG2_HEIGHT = 3966;


    /* =========================
       CANVA URLS
    ========================== */

    const HOME_URL =
      "https://www.canva.com/design/DAHXDm-Q1U8/4WPheNzhMWogiVXa4VgWkg/view?embed";


    const PG1_URL =
      "https://www.canva.com/design/DAHXJ2qulUI/y1Ny_6cpiQN4chiQ_OMktw/view?embed";


    const PG2_URL =
      "https://www.canva.com/design/DAHXMbpo0t0/wRemkdE1Ugs4PvQncVCwWA/view?embed";


    /* =========================
       CURRENT PAGE
       
       0 = HOME
       1 = PG 1
       2 = PG 2
    ========================== */

    let currentPage = 0;


    /* =========================
       HOTSPOT SIZE
    ========================== */

    const HOTSPOT_WIDTH = 180;

    const HOTSPOT_HEIGHT = 160;


    /* =========================
       HOME HOTSPOTS
    ========================== */

    const homeHotspots = [

      {
        element: hotspot1,

        x: 979.4,

        y: 1627.4
      },

      {
        element: hotspot2,

        x: 979.4,

        y: 2004.5
      }

    ];


    /* =========================
       SET PAGE SIZE
    ========================== */

    function setPageSize(pageHeight) {

      const displayedWidth =
        invitation.clientWidth;


      const displayedHeight =
        displayedWidth *
        (pageHeight / DESIGN_WIDTH);


      invitation.style.height =
        displayedHeight + "px";

    }


    /* =========================
       POSITION HOME HOTSPOTS
    ========================== */

    function positionHotspots() {

      const displayedWidth =
        invitation.clientWidth;


      const scale =
        displayedWidth / DESIGN_WIDTH;


      homeHotspots.forEach((hotspot) => {

        const button =
          hotspot.element;


        button.style.left =
          (hotspot.x * scale) + "px";


        button.style.top =
          (hotspot.y * scale) + "px";


        button.style.width =
          (HOTSPOT_WIDTH * scale) + "px";


        button.style.height =
          (HOTSPOT_HEIGHT * scale) + "px";

      });

    }


    /* =========================
       SHOW / HIDE HOTSPOTS
    ========================== */

    function updateHotspots() {

      if (currentPage === 0) {

        hotspot1.style.display =
          "block";

        hotspot2.style.display =
          "block";

      }

      else {

        hotspot1.style.display =
          "none";

        hotspot2.style.display =
          "none";

      }

    }


    /* =========================
       UPDATE PAGE LAYOUT
    ========================== */

    function updatePageLayout() {

      if (currentPage === 0) {

        setPageSize(
          HOME_HEIGHT
        );

      }


      else if (currentPage === 1) {

        setPageSize(
          PG1_HEIGHT
        );

      }


      else if (currentPage === 2) {

        setPageSize(
          PG2_HEIGHT
        );

      }


      positionHotspots();

      updateHotspots();

    }


    /* =========================
       INITIAL HOME
    ========================== */

    updatePageLayout();


    /* =========================
       RESPONSIVE
    ========================== */

    window.addEventListener(
      "resize",
      updatePageLayout
    );


    /* =========================
       CHANGE PAGE
    ========================== */

    function changePage(
      url,
      pageNumber,
      pageHeight
    ) {

      currentPage =
        pageNumber;


      /*
        Change the wrapper size
        BEFORE loading the new Canva.
      */

      setPageSize(
        pageHeight
      );


      updateHotspots();


      /*
        Change Canva design.
      */

      canvaFrame.src =
        url;


      /*
        Always start the new design
        from the top.
      */

      window.scrollTo({
        top: 0,
        behavior: "instant"
      });

    }


    /* =========================
       FIRST HOME BUTTON
       
       HOME → PG 1
    ========================== */

    hotspot1.addEventListener(
      "click",
      function(event) {

        event.preventDefault();

        event.stopPropagation();


        changePage(
          PG1_URL,
          1,
          PG1_HEIGHT
        );

      }
    );


    /* =========================
       SECOND HOME BUTTON
       
       HOME → PG 2
    ========================== */

    hotspot2.addEventListener(
      "click",
      function(event) {

        event.preventDefault();

        event.stopPropagation();


        changePage(
          PG2_URL,
          2,
          PG2_HEIGHT
        );

      }
    );


    /* =========================
       MUSIC
    ========================== */

    function startMusic() {

      song.volume = 1;

      song.muted = false;


      const promise =
        song.play();


      if (promise !== undefined) {

        promise
          .then(() => {

            musicButton.textContent =
              "MUTE";


            touchLayer.style.display =
              "none";

          })
          .catch((error) => {

            console.log(
              "Audio blocked:",
              error
            );

          });

      }

    }


    /* =========================
       FIRST TOUCH
    ========================== */

    touchLayer.addEventListener(
      "touchstart",
      function() {

        startMusic();

      },
      {
        passive: true,
        once: true
      }
    );


    touchLayer.addEventListener(
      "click",
      function() {

        startMusic();

      },
      {
        once: true
      }
    );


    /* =========================
       MUSIC BUTTON
    ========================== */

    musicButton.addEventListener(
      "click",
      function(event) {

        event.stopPropagation();


        if (song.paused) {

          song.volume = 1;

          song.muted = false;


          song.play()
            .then(() => {

              musicButton.textContent =
                "MUTE";

            })
            .catch((error) => {

              console.log(
                "Audio blocked:",
                error
              );

            });

        }

        else {

          song.pause();


          musicButton.textContent =
            "PLAY";

        }

      }
    );


    /* =========================
       AUDIO EVENTS
    ========================== */

    song.addEventListener(
      "play",
      function() {

        musicButton.textContent =
          "MUTE";

      }
    );


    song.addEventListener(
      "pause",
      function() {

        musicButton.textContent =
          "PLAY";

      }
    );

  </script>

</body>

</html>
