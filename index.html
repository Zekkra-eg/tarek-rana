<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <!-- =========================
       PAGE TITLE
  ========================== -->

  <title>Tarek & Rana Wedding</title>

  <!-- =========================
       SOCIAL MEDIA PREVIEW
  ========================== -->

  <meta
    property="og:title"
    content="Tarek & Rana Wedding"
  >

  <meta
    property="og:description"
    content="You're invited to celebrate our special day 🤍"
  >

  <meta
    property="og:image"
    content="preview.jpg"
  >

  <meta
    property="og:type"
    content="website"
  >

  <meta
    property="og:url"
    content="https://zekra.link/rana-wedding"
  >

  <!-- WhatsApp / Facebook -->
  <meta
    name="twitter:card"
    content="summary_large_image"
  >

  <meta
    name="twitter:title"
    content="Tarek & Rana Wedding"
  >

  <meta
    name="twitter:description"
    content="You're invited to celebrate our special day 🤍"
  >

  <meta
    name="twitter:image"
    content="preview.jpg"
  >

  <style>

    /* =========================
       RESET
    ========================== */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      background: #ffffff;
    }

    body {
      overflow-x: hidden;
    }


    /* =========================
       CANVA CONTAINER
       SAME STYLE AS CANVA EMBED
    ========================== */

    .canva-wrapper {
      position: relative;

      width: 100%;
      height: 0;

      padding-top: 380.6003%;

      padding-bottom: 0;

      overflow: hidden;

      border-radius: 8px;

      margin-top: 0;
      margin-bottom: 0;

      will-change: transform;
    }


    /* =========================
       CANVA IFRAME
    ========================== */

    #canvaFrame {
      position: absolute;

      width: 100%;
      height: 100%;

      top: 0;
      left: 0;

      border: none;

      padding: 0;
      margin: 0;

      display: block;
    }


    /* =========================
       FIRST TOUCH LAYER
       Starts the music
    ========================== */

    #touchLayer {
      position: fixed;

      inset: 0;

      width: 100%;
      height: 100%;

      background: transparent;

      z-index: 999999;

      cursor: pointer;
    }


    /* =========================
       PLAY / MUTE BUTTON
    ========================== */

    #soundButton {
      position: fixed;

      right: 18px;
      bottom: 18px;

      z-index: 1000000;

      border: none;

      background: transparent;

      color: white;

      font-family: Arial, sans-serif;

      font-size: 12px;

      letter-spacing: 1px;

      cursor: pointer;

      padding: 8px 10px;

      text-shadow:
        0 1px 3px rgba(0,0,0,.5);

      display: none;
    }


    /* =========================
       NAVIGATION OVERLAYS
    ========================== */

    .nav-button {
      position: absolute;

      z-index: 999998;

      background: transparent;

      border: none;

      padding: 0;

      margin: 0;

      cursor: pointer;

      display: none;
    }


    /* =========================
       PAGE 1 → PAGE 2

       CHANGE THESE VALUES
       TO MATCH YOUR CANVA BUTTON
    ========================== */

    #page1Next {
      /*
        Example:

        top: 88%;
        left: 25%;
        width: 50%;
        height: 8%;
      */

      top: 88%;
      left: 25%;
      width: 50%;
      height: 8%;
    }


    /* =========================
       PAGE 2 → PAGE 3
    ========================== */

    #page2Next {
      top: 88%;
      left: 25%;
      width: 50%;
      height: 8%;
    }


    /* =========================
       PAGE 2 → PAGE 1
       Optional back button
    ========================== */

    #page2Back {
      top: 5%;
      left: 5%;
      width: 20%;
      height: 8%;
    }


    /* =========================
       HIDE NAVIGATION WHEN NOT USED
    ========================== */

    .show {
      display: block !important;
    }

  </style>

</head>


<body>


  <!-- =========================
       MUSIC
  ========================== -->

  <audio
    id="song"
    preload="auto"
    loop
    playsinline
  >
    <source
      src="/song.mp3"
      type="audio/mpeg"
    >
  </audio>


  <!-- =========================
       CANVA
  ========================== -->

  <div class="canva-wrapper">

    <iframe
      id="canvaFrame"

      loading="lazy"

      allowfullscreen="allowfullscreen"

      allow="fullscreen"

    ></iframe>


    <!-- =========================
         PAGE 1 BUTTON
    ========================== -->

    <button
      id="page1Next"
      class="nav-button"
      aria-label="Next"
    ></button>


    <!-- =========================
         PAGE 2 BUTTONS
    ========================== -->

    <button
      id="page2Next"
      class="nav-button"
      aria-label="Next"
    ></button>

    <button
      id="page2Back"
      class="nav-button"
      aria-label="Back"
    ></button>

  </div>


  <!-- =========================
       FIRST TOUCH
  ========================== -->

  <div id="touchLayer"></div>


  <!-- =========================
       SOUND BUTTON
  ========================== -->

  <button id="soundButton">
    MUTE
  </button>


  <script>

    /* =========================
       CANVA PAGES
    ========================== */

    const PAGE_1 =
      "https://www.canva.com/design/DAHXDm-Q1U8/4WPheNzhMWogiVXa4VgWkg/view?embed";


    const PAGE_2 =
      "https://www.canva.com/design/DAHXJ2qulUI/y1Ny_6cpiQN4chiQ_OMktw/view?embed";


    /*
      Add Page 3 URL here
      when you send it
    */

    const PAGE_3 =
      "";


    /* =========================
       ELEMENTS
    ========================== */

    const song =
      document.getElementById("song");

    const canvaFrame =
      document.getElementById("canvaFrame");

    const touchLayer =
      document.getElementById("touchLayer");

    const soundButton =
      document.getElementById("soundButton");

    const page1Next =
      document.getElementById("page1Next");

    const page2Next =
      document.getElementById("page2Next");

    const page2Back =
      document.getElementById("page2Back");


    /* =========================
       CURRENT PAGE
    ========================== */

    let currentPage = 1;


    /* =========================
       START MUSIC
    ========================== */

    function startMusic() {

      song.volume = 1;
      song.muted = false;

      const promise = song.play();

      if (promise !== undefined) {

        promise
          .then(() => {

            console.log(
              "✅ Music started"
            );

            soundButton.textContent =
              "MUTE";

            soundButton.style.display =
              "block";

          })
          .catch(error => {

            console.log(
              "❌ Audio blocked:",
              error
            );

          });

      }

    }


    /* =========================
       SHOW PAGE
    ========================== */

    function showPage(page) {

      currentPage = page;


      /* Hide all navigation */

      page1Next.classList.remove("show");

      page2Next.classList.remove("show");

      page2Back.classList.remove("show");


      /* =========================
         PAGE 1
      ========================== */

      if (page === 1) {

        canvaFrame.src = PAGE_1;

        page1Next.classList.add("show");

      }


      /* =========================
         PAGE 2
      ========================== */

      else if (page === 2) {

        canvaFrame.src = PAGE_2;

        page2Next.classList.add("show");

        page2Back.classList.add("show");

      }


      /* =========================
         PAGE 3
      ========================== */

      else if (page === 3) {

        if (PAGE_3 !== "") {

          canvaFrame.src = PAGE_3;

        }

      }

    }


    /* =========================
       FIRST TOUCH
    ========================== */

    function firstInteraction() {

      startMusic();

      showPage(1);

      /*
        Remove the transparent
        first-touch layer
      */

      touchLayer.style.display =
        "none";

    }


    /* =========================
       TOUCH / CLICK
    ========================== */

    touchLayer.addEventListener(
      "touchstart",
      firstInteraction,
      {
        once: true,
        passive: true
      }
    );


    touchLayer.addEventListener(
      "click",
      firstInteraction,
      {
        once: true
      }
    );


    /* =========================
       PAGE 1 → PAGE 2
    ========================== */

    page1Next.addEventListener(
      "click",
      function(e) {

        e.preventDefault();

        showPage(2);

      }
    );


    /* =========================
       PAGE 2 → PAGE 3
    ========================== */

    page2Next.addEventListener(
      "click",
      function(e) {

        e.preventDefault();

        if (PAGE_3 !== "") {

          showPage(3);

        }

      }
    );


    /* =========================
       PAGE 2 → PAGE 1
    ========================== */

    page2Back.addEventListener(
      "click",
      function(e) {

        e.preventDefault();

        showPage(1);

      }
    );


    /* =========================
       MUTE / UNMUTE
    ========================== */

    soundButton.addEventListener(
      "click",
      function(e) {

        e.preventDefault();

        e.stopPropagation();


        if (song.muted) {

          song.muted = false;

          song.play();

          soundButton.textContent =
            "MUTE";

        }

        else {

          song.muted = true;

          soundButton.textContent =
            "PLAY";

        }

      }
    );


    /* =========================
       PREVENT DOUBLE AUDIO
    ========================== */

    song.addEventListener(
      "ended",
      function() {

        song.currentTime = 0;

        song.play();

      }
    );

  </script>

</body>

</html>
