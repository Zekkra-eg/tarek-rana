<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Tarek & Rana Wedding</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      background: #ffffff;
    }

    body {
      overflow-x: hidden;
    }

    .canva-container {
      position: relative;
      width: 100%;
      height: 0;
      padding-top: 380.6003%;
      overflow: hidden;
    }

    .canva-container iframe {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      border: none;
      padding: 0;
      margin: 0;
    }

    /* Invisible layer used to detect the first touch */
    #touchLayer {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: transparent;
      display: block;
      pointer-events: auto;
    }
  </style>
</head>

<body>

  <!-- =========================
       CANVA EMBED
  ========================== -->

  <div class="canva-container">

    <iframe
      src="https://www.canva.com/design/DAHXJ2qulUI/y1Ny_6cpiQN4chiQ_OMktw/view?embed"
      allowfullscreen
      allow="fullscreen"
      loading="eager">
    </iframe>

  </div>


  <!-- Invisible first-touch layer -->
  <div id="touchLayer"></div>


  <!-- =========================
       MUSIC
  ========================== -->

  <audio
    id="bgMusic"
    src="song.mp3"
    preload="auto"
    loop
    playsinline>
  </audio>


  <script>

    const music = document.getElementById("bgMusic");
    const touchLayer = document.getElementById("touchLayer");

    let musicStarted = false;


    // =========================
    // TRY AUTOPLAY
    // =========================

    function startMusic() {

      if (musicStarted) return;

      music.volume = 1;

      const playPromise = music.play();

      if (playPromise !== undefined) {

        playPromise
          .then(() => {

            musicStarted = true;

            // Remove invisible layer once music starts
            touchLayer.style.display = "none";

          })
          .catch(() => {

            // Autoplay blocked
            // Wait for first user interaction

          });

      }
    }


    // Try immediately
    window.addEventListener("load", () => {
      startMusic();
    });


    // =========================
    // FIRST TOUCH / CLICK
    // =========================

    function firstInteraction() {

      if (musicStarted) return;

      music.play()
        .then(() => {

          musicStarted = true;

          touchLayer.style.display = "none";

        })
        .catch(() => {});

    }


    touchLayer.addEventListener("touchstart", firstInteraction, {
      passive: true
    });

    touchLayer.addEventListener("click", firstInteraction);


    // Also detect any interaction anywhere
    document.addEventListener("touchstart", firstInteraction, {
      passive: true,
      once: true
    });

    document.addEventListener("click", firstInteraction, {
      once: true
    });

  </script>

</body>
</html>
