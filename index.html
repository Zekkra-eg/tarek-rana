<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>Tarek & Rana Wedding</title>


  <!-- =========================
       SOCIAL PREVIEW
  ========================== -->

  <meta
    name="description"
    content="Tarek & Rana Wedding Invitation"
  >

  <meta
    property="og:title"
    content="Tarek & Rana Wedding"
  >

  <meta
    property="og:description"
    content="Tarek & Rana Wedding Invitation"
  >

  <meta
    property="og:image"
    content="https://tarek-rana.vercel.app/preview.png"
  >

  <meta
    property="og:type"
    content="website"
  >

  <meta
    property="og:url"
    content="https://zekra.link/rana-wedding"
  >

  <meta
    property="og:site_name"
    content="Tarek & Rana Wedding"
  >

  <meta
    name="twitter:card"
    content="summary_large_image"
  >

  <meta
    name="twitter:title"
    content="Tarek & Rana Wedding"
  >

  <meta
    name="twitter:description"
    content="Tarek & Rana Wedding Invitation"
  >

  <meta
    name="twitter:image"
    content="https://tarek-rana.vercel.app/preview.png"
  >


  <style>

    /* =========================
       RESET
    ========================== */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }


    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      padding: 0;
      background: #000;
    }


    body {
      overflow-x: hidden;
      overflow-y: auto;
    }


    /* =========================
       INVITATION
    ========================== */

    #invitation {
      position: relative;
      width: 100%;
      height: auto;
      background: #000;
      overflow: hidden;
    }


    /* =========================
       CANVA
    ========================== */

    #canvaFrame {
      position: absolute;
      top: 0;
      left: 0;

      width: 100%;
      height: 100%;

      border: none;
      display: block;

      z-index: 1;
    }


    /* =========================
       CLICKABLE BUTTONS
    ========================== */

    .hotspot {

      position: absolute;

      width: 87.1px;
      height: 78.4px;

      background: transparent;

      border: none;
      padding: 0;
      margin: 0;

      cursor: pointer;

      z-index: 10;

      display: block;

      -webkit-tap-highlight-color: transparent;

      touch-action: manipulation;
    }


    .hotspot:focus,
    .hotspot:active {

      outline: none;

      background: transparent;
    }


    /* =========================
       FIRST TOUCH LAYER
    ========================== */

    #touchLayer {

      position: fixed;

      inset: 0;

      z-index: 999998;

      background: transparent;

      touch-action: manipulation;
    }

  </style>

</head>


<body>


  <!-- =========================
       INVITATION
  ========================== -->

  <main id="invitation">

    <iframe
      id="canvaFrame"
      src="https://www.canva.com/design/DAHXDm-Q1U8/4WPheNzhMWogiVXa4VgWkg/view?embed"
      allowfullscreen
      allow="fullscreen; autoplay"
    ></iframe>


    <!-- HOME → PG 1 -->

    <button
      class="hotspot"
      id="hotspot1"
      aria-label="Open PG 1"
    ></button>


    <!-- HOME → PG 2 -->

    <button
      class="hotspot"
      id="hotspot2"
      aria-label="Open PG 2"
    ></button>

  </main>


  <!-- =========================
       MUSIC
  ========================== -->

  <audio
    id="song"
    src="/song.mp3"
    preload="auto"
    loop
  ></audio>


  <!-- FIRST INTERACTION -->

  <div id="touchLayer"></div>


  <script>

    /* =========================
       ELEMENTS
    ========================== */

    const invitation =
      document.getElementById("invitation");

    const hotspot1 =
      document.getElementById("hotspot1");

    const hotspot2 =
      document.getElementById("hotspot2");

    const song =
      document.getElementById("song");

    const touchLayer =
      document.getElementById("touchLayer");


    /* =========================
       DESIGN SIZE
    ========================== */

    const DESIGN_WIDTH = 1366;

    const HOME_HEIGHT = 5199;


    /* =========================
       PAGE URLS
    ========================== */

    const PG1_URL =
      "https://zekra.link/t-r";

    const PG2_URL =
      "https://zekra.link/t-r/page-2";


    /* =========================
       HOTSPOT SIZE
    ========================== */

    const HOTSPOT_WIDTH = 87.1;

    const HOTSPOT_HEIGHT = 78.4;


    /* =========================
       HOTSPOT POSITIONS
       Coordinates are based on
       the original 1366 × 5199
       Canva design
    ========================== */

    const homeHotspots = [

      {
        element: hotspot1,

        x: 934.3,

        y: 1586.5
      },

      {
        element: hotspot2,

        x: 935.5,

        y: 1922.7
      }

    ];


    /* =========================
       SET HOME SIZE
    ========================== */

    function setHomeSize() {

      const displayedWidth =
        invitation.clientWidth;

      const displayedHeight =
        displayedWidth *
        (HOME_HEIGHT / DESIGN_WIDTH);

      invitation.style.height =
        displayedHeight + "px";
    }


    /* =========================
       POSITION HOTSPOTS
    ========================== */

    function positionHotspots() {

      const displayedWidth =
        invitation.clientWidth;

      const scale =
        displayedWidth / DESIGN_WIDTH;


      homeHotspots.forEach(function(hotspot) {

        const button =
          hotspot.element;


        /*
          Position is calculated
          from the original Canva
          1366px-wide design.
        */

        button.style.left =
          (hotspot.x * scale) + "px";


        button.style.top =
          (hotspot.y * scale) + "px";


        /*
          Keep the exact original
          button size while scaling
          with the Canva design.
        */

        button.style.width =
          (HOTSPOT_WIDTH * scale) + "px";


        button.style.height =
          (HOTSPOT_HEIGHT * scale) + "px";

      });
    }


    /* =========================
       INITIALIZE
    ========================== */

    setHomeSize();

    positionHotspots();


    /* =========================
       RESIZE
    ========================== */

    window.addEventListener(
      "resize",
      function() {

        setHomeSize();

        positionHotspots();

      }
    );


    /* =========================
       OPEN PG 1 — NEW TAB
    ========================== */

    hotspot1.addEventListener(
      "click",
      function(event) {

        event.preventDefault();

        event.stopPropagation();

        window.open(
          PG1_URL,
          "_blank"
        );

      }
    );


    /* =========================
       OPEN PG 2 — NEW TAB
    ========================== */

    hotspot2.addEventListener(
      "click",
      function(event) {

        event.preventDefault();

        event.stopPropagation();

        window.open(
          PG2_URL,
          "_blank"
        );

      }
    );


    /* =========================
       START MUSIC
    ========================== */

    function startMusic() {

      song.volume = 1;

      song.muted = false;


      const promise =
        song.play();


      if (promise !== undefined) {

        promise
          .then(function() {

            touchLayer.style.display =
              "none";

          })
          .catch(function(error) {

            console.log(
              "Audio blocked:",
              error
            );

          });

      }

    }


    /* =========================
       FIRST TOUCH
    ========================== */

    touchLayer.addEventListener(
      "touchstart",
      function() {

        startMusic();

      },
      {
        passive: true,
        once: true
      }
    );


    touchLayer.addEventListener(
      "click",
      function() {

        startMusic();

      },
      {
        once: true
      }
    );

  </script>

</body>

</html>
