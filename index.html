<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<title>Tarek & Rana Wedding</title>

<style>

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html,
body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
}


/* =========================
   CANVA
========================= */

#canvaFrame {

  position: fixed;

  inset: 0;

  width: 100%;
  height: 100%;

  border: none;

  display: block;
}


/* =========================
   FIRST TOUCH LAYER
========================= */

#touchLayer {

  position: fixed;

  inset: 0;

  z-index: 999998;

  background: transparent;

  touch-action: manipulation;

}


/* =========================
   MUSIC BUTTON
========================= */

#musicButton {

  position: fixed;

  right: 18px;
  bottom: 18px;

  z-index: 999999;

  min-width: 82px;
  height: 38px;

  padding: 0 16px;

  border: 1px solid rgba(255,255,255,0.65);

  border-radius: 30px;

  background: rgba(255,255,255,0.08);

  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);

  color: white;

  font-family: Arial, sans-serif;

  font-size: 12px;

  letter-spacing: 1.5px;

  font-weight: 500;

  cursor: pointer;

  display: flex;

  align-items: center;
  justify-content: center;

  -webkit-tap-highlight-color: transparent;
}

</style>

</head>


<body>


<!-- =========================
     CANVA
========================= -->

<iframe

  id="canvaFrame"

  src="https://www.canva.com/design/DAHXDm-Q1U8/4WPheNzhMWogiVXa4VgWkg/view?embed"

  allowfullscreen

  allow="fullscreen; autoplay"

></iframe>


<!-- =========================
     SONG
========================= -->

<audio

  id="song"

  src="/song.mp3"

  preload="auto"

  loop

></audio>


<!-- =========================
     FIRST TOUCH
========================= -->

<div id="touchLayer"></div>


<!-- =========================
     MUSIC BUTTON
========================= -->

<button

  id="musicButton"

  type="button"

>

PLAY

</button>



<script>


const song =
  document.getElementById("song");

const touchLayer =
  document.getElementById("touchLayer");

const musicButton =
  document.getElementById("musicButton");



/* =========================
   START MUSIC
========================= */

function startMusic() {

  song.volume = 1;

  song.muted = false;


  const promise = song.play();


  if (promise !== undefined) {

    promise

      .then(() => {

        musicButton.textContent = "MUTE";

        /*
          Remove transparent layer
          AFTER audio successfully starts
        */

        touchLayer.style.display = "none";


        console.log(
          "✅ MUSIC STARTED"
        );

      })

      .catch(error => {

        console.log(
          "❌ AUDIO BLOCKED",
          error
        );

      });

  }

}



/* =========================
   FIRST TOUCH
========================= */

touchLayer.addEventListener(
  "touchstart",
  function () {

    startMusic();

  },
  {
    passive: true,
    once: true
  }
);



/* =========================
   FIRST CLICK
========================= */

touchLayer.addEventListener(
  "click",
  function () {

    startMusic();

  },
  {
    once: true
  }
);



/* =========================
   MUSIC BUTTON
========================= */

musicButton.addEventListener(
  "click",
  function (event) {

    event.stopPropagation();


    if (song.paused) {

      song.volume = 1;

      song.muted = false;

      song.play()
        .then(() => {

          musicButton.textContent =
            "MUTE";

        });

    }

    else {

      song.pause();

      musicButton.textContent =
        "PLAY";

    }

  }
);



/* =========================
   AUDIO EVENTS
========================= */

song.addEventListener(
  "play",
  function () {

    musicButton.textContent =
      "MUTE";

  }
);


song.addEventListener(
  "pause",
  function () {

    musicButton.textContent =
      "PLAY";

  }
);


</script>


</body>

</html>
