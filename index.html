<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>Tarek & Rana Wedding</title>


  <!-- =========================
       SOCIAL MEDIA PREVIEW
  ========================== -->

  <meta
    name="description"
    content="Tarek & Rana Wedding Invitation"
  >

  <meta
    property="og:title"
    content="Tarek & Rana Wedding"
  >

  <meta
    property="og:description"
    content="Tarek & Rana Wedding Invitation"
  >

  <meta
    property="og:image"
    content="https://tarek-rana.vercel.app/preview.png"
  >

  <meta
    property="og:type"
    content="website"
  >

  <meta
    property="og:url"
    content="https://zekra.link/rana-wedding"
  >

  <meta
    property="og:site_name"
    content="Tarek & Rana Wedding"
  >

  <meta
    name="twitter:card"
    content="summary_large_image"
  >

  <meta
    name="twitter:title"
    content="Tarek & Rana Wedding"
  >

  <meta
    name="twitter:description"
    content="Tarek & Rana Wedding Invitation"
  >

  <meta
    name="twitter:image"
    content="https://tarek-rana.vercel.app/preview.png"
  >


  <style>

    /* =========================
       RESET
    ========================= */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }


    html,
    body {

      width: 100%;

      min-height: 100%;

      margin: 0;

      padding: 0;

      background: #000;

    }


    body {

      overflow-x: hidden;

      overflow-y: auto;

    }


    /* =========================
       CANVA WRAPPER

       Original design:
       1366 × 5199
    ========================== */

    #invitation {

      position: relative;

      width: 100%;

      aspect-ratio: 1366 / 5199;

      background: #000;

    }


    /* =========================
       CANVA IFRAME
    ========================== */

    #canvaFrame {

      position: absolute;

      top: 0;
      left: 0;

      width: 100%;
      height: 100%;

      border: none;

      display: block;

      z-index: 1;

    }


    /* =========================
       TRANSPARENT HOTSPOTS
    ========================== */

    .hotspot {

      position: absolute;

      /*
        Original element:
        87.1 × 78.4

        Increased slightly for easier
        tapping on mobile.
      */

      width: 110px;

      height: 100px;


      background: transparent;

      border: none;

      padding: 0;

      margin: 0;

      cursor: pointer;

      z-index: 10;

      display: block;

      -webkit-tap-highlight-color: transparent;

      touch-action: manipulation;

    }


    .hotspot:focus,
    .hotspot:active {

      outline: none;

      background: transparent;

    }


    /* =========================
       MUSIC BUTTON
    ========================== */

    #musicButton {

      position: fixed;

      right: 18px;

      bottom: 18px;

      z-index: 999999;


      min-width: 82px;

      height: 38px;


      padding: 0 16px;


      border: 1px solid rgba(255, 255, 255, 0.65);

      border-radius: 30px;


      background: rgba(255, 255, 255, 0.08);


      backdrop-filter: blur(8px);

      -webkit-backdrop-filter: blur(8px);


      color: white;


      font-family: Arial, sans-serif;

      font-size: 12px;

      letter-spacing: 1.5px;

      font-weight: 500;


      cursor: pointer;


      display: flex;

      align-items: center;

      justify-content: center;


      -webkit-tap-highlight-color: transparent;

    }


    #musicButton:focus {

      outline: none;

    }


    #musicButton:hover {

      background: rgba(255, 255, 255, 0.14);

    }


    /* =========================
       FIRST TOUCH LAYER
    ========================== */

    #touchLayer {

      position: fixed;

      inset: 0;

      z-index: 999998;

      background: transparent;

      touch-action: manipulation;

    }

  </style>

</head>


<body>


  <!-- =========================
       INVITATION
  ========================== -->

  <main id="invitation">


    <!-- =========================
         CANVA
    ========================== -->

    <iframe

      id="canvaFrame"

      src="https://www.canva.com/design/DAHXJ2qulUI/y1Ny_6cpiQN4chiQ_OMktw/view?embed"

      allowfullscreen

      allow="fullscreen; autoplay"

    ></iframe>



    <!-- =========================
         HOTSPOT 1

         X = 979.4
         Y = 1627.4
    ========================== -->

    <button

      class="hotspot"

      id="hotspot1"

      aria-label="Button 1"

    ></button>



    <!-- =========================
         HOTSPOT 2

         X = 979.4
         Y = 2004.5
    ========================== -->

    <button

      class="hotspot"

      id="hotspot2"

      aria-label="Button 2"

    ></button>


  </main>



  <!-- =========================
       MUSIC
  ========================== -->

  <audio

    id="song"

    src="/song.mp3"

    preload="auto"

    loop

  ></audio>



  <!-- =========================
       FIRST TOUCH
  ========================== -->

  <div id="touchLayer"></div>



  <!-- =========================
       MUSIC BUTTON
  ========================== -->

  <button

    id="musicButton"

    type="button"

  >
    PLAY
  </button>



  <script>


    /* =========================
       ELEMENTS
    ========================= */

    const invitation =
      document.getElementById("invitation");

    const canvaFrame =
      document.getElementById("canvaFrame");

    const hotspot1 =
      document.getElementById("hotspot1");

    const hotspot2 =
      document.getElementById("hotspot2");

    const song =
      document.getElementById("song");

    const touchLayer =
      document.getElementById("touchLayer");

    const musicButton =
      document.getElementById("musicButton");



    /* =========================
       ORIGINAL CANVA SIZE
    ========================= */

    const DESIGN_WIDTH = 1366;

    const DESIGN_HEIGHT = 5199;



    /* =========================
       ORIGINAL HOTSPOT SIZE
    ========================= */

    const ORIGINAL_WIDTH = 87.1;

    const ORIGINAL_HEIGHT = 78.4;



    /*
      Slightly larger than the original.

      110 × 100 gives easier
      touch interaction.
    */

    const HOTSPOT_WIDTH = 110;

    const HOTSPOT_HEIGHT = 100;



    /* =========================
       HOTSPOT DATA
    ========================= */

    const hotspots = [

      {
        element: hotspot1,

        x: 979.4,

        y: 1627.4

      },

      {
        element: hotspot2,

        x: 979.4,

        y: 2004.5

      }

    ];



    /* =========================
       PLACEHOLDER URLS
    ========================= */

    const PLACEHOLDER_1 =
      "https://example.com/page-1";

    const PLACEHOLDER_2 =
      "https://example.com/page-2";



    /* =========================
       POSITION HOTSPOTS
    ========================== */

    function positionHotspots() {


      /*
        Current displayed width
        of the 1366px design.
      */

      const displayedWidth =
        invitation.clientWidth;


      /*
        Scale from original Canva
        coordinates to displayed size.
      */

      const scale =
        displayedWidth / DESIGN_WIDTH;



      hotspots.forEach((hotspot) => {


        const button =
          hotspot.element;



        /*
          X position
        */

        button.style.left =
          (hotspot.x * scale) + "px";



        /*
          Y position
        */

        button.style.top =
          (hotspot.y * scale) + "px";



        /*
          Scaled clickable area
        */

        button.style.width =
          (HOTSPOT_WIDTH * scale) + "px";


        button.style.height =
          (HOTSPOT_HEIGHT * scale) + "px";


      });

    }



    /* =========================
       POSITION INIT
    ========================== */

    positionHotspots();



    /* =========================
       RESIZE
    ========================== */

    window.addEventListener(

      "resize",

      positionHotspots

    );



    /* =========================
       CHANGE IFRAME
    ========================== */

    function changeIframe(url) {

      canvaFrame.src = url;

    }



    /* =========================
       HOTSPOT 1
    ========================== */

    hotspot1.addEventListener(

      "click",

      function (event) {

        event.preventDefault();

        event.stopPropagation();


        changeIframe(

          PLACEHOLDER_1

        );

      }

    );



    /* =========================
       HOTSPOT 2
    ========================== */

    hotspot2.addEventListener(

      "click",

      function (event) {

        event.preventDefault();

        event.stopPropagation();


        changeIframe(

          PLACEHOLDER_2

        );

      }

    );



    /* =========================
       START MUSIC
    ========================== */

    function startMusic() {


      song.volume = 1;

      song.muted = false;


      const promise =
        song.play();



      if (promise !== undefined) {


        promise

          .then(() => {


            musicButton.textContent =
              "MUTE";


            /*
              Remove the first-touch
              layer after successful
              playback.
            */

            touchLayer.style.display =
              "none";


          })


          .catch((error) => {


            console.log(

              "Audio blocked:",

              error

            );


          });

      }

    }



    /* =========================
       FIRST TOUCH
    ========================== */

    touchLayer.addEventListener(

      "touchstart",

      function () {

        startMusic();

      },

      {

        passive: true,

        once: true

      }

    );



    /* =========================
       FIRST CLICK
    ========================== */

    touchLayer.addEventListener(

      "click",

      function () {

        startMusic();

      },

      {

        once: true

      }

    );



    /* =========================
       MUSIC BUTTON
    ========================== */

    musicButton.addEventListener(

      "click",

      function (event) {


        event.stopPropagation();



        if (song.paused) {


          song.volume = 1;

          song.muted = false;


          song.play()

            .then(() => {


              musicButton.textContent =
                "MUTE";


            })

            .catch((error) => {


              console.log(

                "Audio blocked:",

                error

              );


            });


        }


        else {


          song.pause();


          musicButton.textContent =
            "PLAY";


        }

      }

    );



    /* =========================
       AUDIO EVENTS
    ========================== */

    song.addEventListener(

      "play",

      function () {

        musicButton.textContent =
          "MUTE";

      }

    );


    song.addEventListener(

      "pause",

      function () {

        musicButton.textContent =
          "PLAY";

      }

    );


  </script>


</body>

</html>
