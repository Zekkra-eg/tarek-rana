<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>Tarek & Rana Wedding</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    /* Canva page */
    #canvaFrame {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* Music button */
    #musicButton {
      position: fixed;
      right: 18px;
      bottom: 18px;

      width: 48px;
      height: 48px;

      border: none;
      border-radius: 50%;

      background: rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);

      color: white;
      font-size: 20px;

      display: flex;
      align-items: center;
      justify-content: center;

      cursor: pointer;
      z-index: 99999;

      -webkit-tap-highlight-color: transparent;
    }

    #musicButton:active {
      transform: scale(0.94);
    }
  </style>
</head>


<body>

  <!-- =========================
       CANVA PAGE
  ========================== -->

  <iframe
    id="canvaFrame"
    src="https://www.canva.com/design/DAHXDm-Q1U8/4WPheNzhMWogiVXa4VgWkg/view?embed"
    allow="fullscreen; autoplay"
    allowfullscreen>
  </iframe>


  <!-- =========================
       MUSIC
  ========================== -->

  <audio
    id="music"
    src="/song.mp3"
    preload="auto"
    loop
    playsinline>
  </audio>


  <!-- =========================
       MUSIC BUTTON
  ========================== -->

  <button
    id="musicButton"
    type="button"
    aria-label="Play or mute music">
    🔇
  </button>


  <script>

    const music = document.getElementById("music");
    const musicButton = document.getElementById("musicButton");


    /* =========================
       START MUSIC
    ========================== */

    async function startMusic() {

      try {

        await music.play();

        musicButton.textContent = "🔊";

      } catch (error) {

        console.log("Autoplay blocked");

      }

    }


    /* =========================
       FIRST USER TOUCH
    ========================== */

    document.addEventListener(
      "touchstart",
      startMusic,
      {
        once: true,
        passive: true
      }
    );


    document.addEventListener(
      "pointerdown",
      startMusic,
      {
        once: true,
        passive: true
      }
    );


    /* =========================
       PLAY / MUTE BUTTON
    ========================== */

    musicButton.addEventListener(
      "click",
      async function (event) {

        event.stopPropagation();

        if (music.paused) {

          try {

            await music.play();

            musicButton.textContent = "🔊";

          } catch (error) {

            console.log("Music could not start");

          }

        } else {

          music.pause();

          musicButton.textContent = "🔇";

        }

      }
    );


    /* =========================
       KEEP BUTTON UPDATED
    ========================== */

    music.addEventListener(
      "play",
      function () {
        musicButton.textContent = "🔊";
      }
    );


    music.addEventListener(
      "pause",
      function () {
        musicButton.textContent = "🔇";
      }
    );

  </script>

</body>

</html>
