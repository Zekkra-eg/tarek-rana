<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>Tarek & Rana Wedding</title>


  <!-- =========================
       SOCIAL MEDIA PREVIEW
  ========================== -->

  <meta
    name="description"
    content="Tarek & Rana Wedding Invitation"
  >

  <meta
    property="og:title"
    content="Tarek & Rana Wedding"
  >

  <meta
    property="og:description"
    content="Tarek & Rana Wedding Invitation"
  >

  <meta
    property="og:image"
    content="https://tarek-rana.vercel.app/preview.png"
  >

  <meta
    property="og:type"
    content="website"
  >

  <meta
    property="og:url"
    content="https://zekra.link/rana-wedding"
  >

  <meta
    property="og:site_name"
    content="Tarek & Rana Wedding"
  >

  <meta
    name="twitter:card"
    content="summary_large_image"
  >

  <meta
    name="twitter:title"
    content="Tarek & Rana Wedding"
  >

  <meta
    name="twitter:description"
    content="Tarek & Rana Wedding Invitation"
  >

  <meta
    name="twitter:image"
    content="https://tarek-rana.vercel.app/preview.png"
  >


  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }


    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      padding: 0;
      background: #000;
    }


    body {
      overflow-x: hidden;
      overflow-y: auto;
    }


    /* =========================
       INVITATION WRAPPER
    ========================== */

    #invitation {
      position: relative;
      width: 100%;
      height: auto;
      background: #000;
      overflow: hidden;
    }


    /* =========================
       CANVA IFRAME
    ========================== */

    #canvaFrame {
      position: absolute;
      top: 0;
      left: 0;

      width: 100%;
      height: 100%;

      border: none;
      display: block;

      z-index: 1;
    }


    /* =========================
       HOTSPOTS
    ========================== */

    .hotspot {
      position: absolute;

      width: 180px;
      height: 160px;

      background: transparent;
      border: none;

      padding: 0;
      margin: 0;

      cursor: pointer;

      z-index: 10;

      display: block;

      -webkit-tap-highlight-color: transparent;

      touch-action: manipulation;
    }


    .hotspot:focus,
    .hotspot:active {
      outline: none;
      background: transparent;
    }


    /* =========================
       MUSIC BUTTON
    ========================== */

    #musicButton {
      position: fixed;

      right: 18px;
      bottom: 18px;

      z-index: 999999;

      min-width: 82px;
      height: 38px;

      padding: 0 16px;

      border: 1px solid rgba(255, 255, 255, 0.65);

      border-radius: 30px;

      background: rgba(255, 255, 255, 0.08);

      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);

      color: white;

      font-family: Arial, sans-serif;

      font-size: 12px;

      letter-spacing: 1.5px;

      font-weight: 500;

      cursor: pointer;

      display: flex;

      align-items: center;
      justify-content: center;

      -webkit-tap-highlight-color: transparent;
    }


    #musicButton:focus {
      outline: none;
    }


    #musicButton:hover {
      background: rgba(255, 255, 255, 0.14);
    }


    /* =========================
       FIRST-TOUCH MUSIC LAYER
    ========================== */

    #touchLayer {
      position: fixed;

      inset: 0;

      z-index: 999998;

      background: transparent;

      touch-action: manipulation;
    }

  </style>

</head>


<body>


  <!-- =========================
       INVITATION
  ========================== -->

  <main id="invitation">

    <iframe
      id="canvaFrame"
      src="https://www.canva.com/design/DAHXDm-Q1U8/4WPheNzhMWogiVXa4VgWkg/view?embed"
      allowfullscreen
      allow="fullscreen; autoplay"
    ></iframe>


    <!-- PAGE 1 HOTSPOT -->

    <button
      class="hotspot"
      id="hotspot1"
      aria-label="Open page 2"
    ></button>


    <!-- PAGE 2 HOTSPOT -->

    <button
      class="hotspot"
      id="hotspot2"
      aria-label="Open page 2"
    ></button>

  </main>


  <!-- =========================
       MUSIC
  ========================== -->

  <audio
    id="song"
    src="/song.mp3"
    preload="auto"
    loop
  ></audio>


  <!-- FIRST TOUCH -->

  <div id="touchLayer"></div>


  <!-- MUSIC BUTTON -->

  <button
    id="musicButton"
    type="button"
  >
    PLAY
  </button>


  <script>

    /* =========================
       ELEMENTS
    ========================== */

    const invitation =
      document.getElementById("invitation");

    const canvaFrame =
      document.getElementById("canvaFrame");

    const hotspot1 =
      document.getElementById("hotspot1");

    const hotspot2 =
      document.getElementById("hotspot2");

    const song =
      document.getElementById("song");

    const touchLayer =
      document.getElementById("touchLayer");

    const musicButton =
      document.getElementById("musicButton");


    /* =========================
       DESIGN SIZES
    ========================== */

    const DESIGN_WIDTH = 1366;

    const PAGE_1_HEIGHT = 5199;

    const PAGE_2_HEIGHT = 6976;


    /* =========================
       CANVA URLS
    ========================== */

    const PAGE_1_URL =
      "https://www.canva.com/design/DAHXJ2qulUI/y1Ny_6cpiQN4chiQ_OMktw/view?embed";


    /*
      Replace this with the real Canva
      URL of the second design.
    */

    const PAGE_2_URL =
      "https://www.canva.com/design/DAHXMbpo0t0/wRemkdE1Ugs4PvQncVCwWA/view?embed";


    /* =========================
       CURRENT PAGE
    ========================== */

    let currentPage = 1;


    /* =========================
       HOTSPOT SIZE
    ========================== */

    const HOTSPOT_WIDTH = 180;

    const HOTSPOT_HEIGHT = 160;


    /* =========================
       HOTSPOT POSITIONS
    ========================== */

    /*
      These coordinates are based
      on the original 1366px design.
    */

    const PAGE_1_HOTSPOTS = [

      {
        element: hotspot1,

        x: 979.4,
        y: 1627.4
      },

      {
        element: hotspot2,

        x: 979.4,
        y: 2004.5
      }

    ];


    /* =========================
       SET PAGE SIZE
    ========================== */

    function setPageSize(pageHeight) {

      const width =
        invitation.clientWidth;

      const height =
        width * (pageHeight / DESIGN_WIDTH);

      invitation.style.height =
        height + "px";

    }


    /* =========================
       POSITION HOTSPOTS
    ========================== */

    function positionHotspots() {

      const displayedWidth =
        invitation.clientWidth;


      const scale =
        displayedWidth / DESIGN_WIDTH;


      PAGE_1_HOTSPOTS.forEach((hotspot) => {

        const button =
          hotspot.element;


        button.style.left =
          (hotspot.x * scale) + "px";


        button.style.top =
          (hotspot.y * scale) + "px";


        button.style.width =
          (HOTSPOT_WIDTH * scale) + "px";


        button.style.height =
          (HOTSPOT_HEIGHT * scale) + "px";

      });

    }


    /* =========================
       UPDATE PAGE
    ========================== */

    function updatePageLayout() {

      if (currentPage === 1) {

        setPageSize(
          PAGE_1_HEIGHT
        );

      }


      if (currentPage === 2) {

        setPageSize(
          PAGE_2_HEIGHT
        );

      }


      positionHotspots();

    }


    /* =========================
       INITIAL LAYOUT
    ========================== */

    updatePageLayout();


    window.addEventListener(
      "resize",
      updatePageLayout
    );


    /* =========================
       CHANGE CANVA PAGE
    ========================== */

    function changePage(
      url,
      pageNumber
    ) {

      currentPage =
        pageNumber;


      canvaFrame.src =
        url;


      updatePageLayout();

    }


    /* =========================
       HOTSPOT 1
       PAGE 1 → PAGE 2
    ========================== */

    hotspot1.addEventListener(
      "click",
      function(event) {

        event.preventDefault();

        event.stopPropagation();


        changePage(
          PAGE_2_URL,
          2
        );

      }
    );


    /* =========================
       HOTSPOT 2
       PAGE 2 → PAGE 2
       
       Change this later to
       another page if needed.
    ========================== */

    hotspot2.addEventListener(
      "click",
      function(event) {

        event.preventDefault();

        event.stopPropagation();


        changePage(
          PAGE_2_URL,
          2
        );

      }
    );


    /* =========================
       MUSIC
    ========================== */

    function startMusic() {

      song.volume = 1;

      song.muted = false;


      const promise =
        song.play();


      if (promise !== undefined) {

        promise
          .then(() => {

            musicButton.textContent =
              "MUTE";


            touchLayer.style.display =
              "none";

          })
          .catch((error) => {

            console.log(
              "Audio blocked:",
              error
            );

          });

      }

    }


    /* =========================
       FIRST TOUCH
    ========================== */

    touchLayer.addEventListener(
      "touchstart",
      function() {

        startMusic();

      },
      {
        passive: true,
        once: true
      }
    );


    touchLayer.addEventListener(
      "click",
      function() {

        startMusic();

      },
      {
        once: true
      }
    );


    /* =========================
       MUSIC BUTTON
    ========================== */

    musicButton.addEventListener(
      "click",
      function(event) {

        event.stopPropagation();


        if (song.paused) {

          song.volume = 1;

          song.muted = false;


          song.play()
            .then(() => {

              musicButton.textContent =
                "MUTE";

            })
            .catch((error) => {

              console.log(
                "Audio blocked:",
                error
              );

            });

        }

        else {

          song.pause();


          musicButton.textContent =
            "PLAY";

        }

      }
    );


    /* =========================
       AUDIO EVENTS
    ========================== */

    song.addEventListener(
      "play",
      function() {

        musicButton.textContent =
          "MUTE";

      }
    );


    song.addEventListener(
      "pause",
      function() {

        musicButton.textContent =
          "PLAY";

      }
    );

  </script>

</body>

</html>
