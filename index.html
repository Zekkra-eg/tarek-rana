<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>Tarek & Rana Wedding</title>


  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }


    /* =========================
       CANVA
    ========================= */

    #canvaFrame {

      position: fixed;

      width: 100%;
      height: 100%;

      top: 0;
      left: 0;

      border: none;

      display: block;

      background: #000;
    }


    /* =========================
       MUSIC BUTTON
    ========================= */

    #musicButton {

      position: fixed;

      right: 18px;
      bottom: 18px;

      z-index: 999999;

      min-width: 82px;
      height: 38px;

      padding: 0 16px;

      border: 1px solid rgba(255,255,255,0.65);

      border-radius: 30px;

      background: rgba(255,255,255,0.08);

      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);

      color: #fff;

      font-family: Arial, sans-serif;

      font-size: 12px;

      letter-spacing: 1.5px;

      font-weight: 500;

      cursor: pointer;

      display: flex;

      align-items: center;

      justify-content: center;

      -webkit-tap-highlight-color: transparent;
    }


    #musicButton:active {
      transform: scale(0.95);
    }


  </style>

</head>


<body>


  <!-- =========================
       CANVA
  ========================= -->

  <iframe

    id="canvaFrame"

    src="https://www.canva.com/design/DAHXDm-Q1U8/4WPheNzhMWogiVXa4VgWkg/view?embed"

    allowfullscreen

    allow="fullscreen; autoplay"

  ></iframe>


  <!-- =========================
       SONG
  ========================= -->

  <audio

    id="song"

    src="/song.mp3"

    preload="auto"

    loop

  ></audio>


  <!-- =========================
       MUSIC BUTTON
  ========================= -->

  <button
    id="musicButton"
    type="button"
  >
    PLAY
  </button>



  <script>


    const song =
      document.getElementById("song");

    const musicButton =
      document.getElementById("musicButton");


    let musicStarted = false;


    /* =========================
       PLAY SONG
       SAFARI / IOS
    ========================= */

    function playSongFromGesture() {

      if (musicStarted) {
        return;
      }


      song.volume = 1;

      song.muted = false;


      const promise = song.play();


      if (promise !== undefined) {

        promise

          .then(() => {

            musicStarted = true;

            musicButton.textContent = "MUTE";

            console.log(
              "✅ Song started"
            );

          })

          .catch(error => {

            console.log(
              "❌ Audio blocked:",
              error
            );

          });

      }

    }


    /* =========================
       FIRST TOUCH
    ========================= */

    document.addEventListener(
      "touchstart",
      function () {

        playSongFromGesture();

      },
      {
        passive: true,
        once: true
      }
    );


    /* =========================
       FIRST SCROLL
    ========================= */

    document.addEventListener(
      "scroll",
      function () {

        playSongFromGesture();

      },
      {
        passive: true,
        once: true
      }
    );


    /* =========================
       DESKTOP CLICK
    ========================= */

    document.addEventListener(
      "click",
      function () {

        playSongFromGesture();

      },
      {
        once: true
      }
    );


    /* =========================
       MUSIC BUTTON
    ========================= */

    musicButton.addEventListener(
      "click",
      function (event) {

        event.stopPropagation();


        if (song.paused) {

          song.volume = 1;

          song.muted = false;

          song.play()
            .then(() => {

              musicStarted = true;

              musicButton.textContent =
                "MUTE";

            })
            .catch(error => {

              console.log(
                "Audio error:",
                error
              );

            });

        }

        else {

          song.pause();

          musicButton.textContent =
            "PLAY";

        }

      }
    );


    /* =========================
       AUDIO EVENTS
    ========================= */

    song.addEventListener(
      "play",
      function () {

        musicButton.textContent =
          "MUTE";

      }
    );


    song.addEventListener(
      "pause",
      function () {

        musicButton.textContent =
          "PLAY";

      }
    );


  </script>


</body>

</html>
