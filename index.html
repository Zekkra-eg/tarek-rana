<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>Tarek & Rana Wedding</title>


  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }


    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }


    /* =========================
       CANVA
    ========================= */

    #canvaFrame {

      position: fixed;

      inset: 0;

      width: 100%;
      height: 100%;

      border: none;

      display: block;

      background: #000;

    }


    /* =========================
       MUSIC BUTTON
    ========================= */

    #musicButton {

      position: fixed;

      right: 18px;
      bottom: 18px;

      z-index: 999999;

      min-width: 82px;
      height: 38px;

      padding: 0 16px;

      border: 1px solid rgba(255, 255, 255, 0.65);

      border-radius: 30px;

      background: rgba(255, 255, 255, 0.08);

      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);

      color: #fff;

      font-family: Arial, sans-serif;

      font-size: 12px;

      letter-spacing: 1.5px;

      font-weight: 500;

      cursor: pointer;

      display: flex;

      align-items: center;

      justify-content: center;

      -webkit-tap-highlight-color: transparent;

      transition: 0.2s ease;

    }


    #musicButton:active {

      transform: scale(0.95);

    }


    #musicButton:hover {

      background: rgba(255, 255, 255, 0.15);

    }

  </style>

</head>


<body>


  <!-- =========================
       CANVA PAGE 1
  ========================== -->

  <iframe

    id="canvaFrame"

    src="https://www.canva.com/design/DAHXDm-Q1U8/4WPheNzhMWogiVXa4VgWkg/view?embed"

    allow="fullscreen; autoplay"

    allowfullscreen>

  </iframe>


  <!-- =========================
       MUSIC
  ========================== -->

  <audio

    id="music"

    src="song.mp3"

    preload="auto"

    loop>

  </audio>


  <!-- =========================
       MUSIC BUTTON
  ========================== -->

  <button

    id="musicButton"

    type="button">

    PLAY

  </button>


  <script>


    const music =
      document.getElementById("music");

    const musicButton =
      document.getElementById("musicButton");


    /* =========================
       PLAY / MUTE
    ========================== */

    musicButton.addEventListener(
      "click",
      async function () {


        if (music.paused) {


          try {

            await music.play();

            musicButton.textContent = "MUTE";

          }

          catch (error) {

            console.log(
              "Could not play music:",
              error
            );

          }


        }

        else {


          music.pause();

          musicButton.textContent = "PLAY";


        }

      }
    );


    /* =========================
       KEEP BUTTON IN SYNC
    ========================== */

    music.addEventListener(
      "play",
      function () {

        musicButton.textContent = "MUTE";

      }
    );


    music.addEventListener(
      "pause",
      function () {

        musicButton.textContent = "PLAY";

      }
    );


  </script>


</body>

</html>
